name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies (apps/web)
        working-directory: apps/web
        run: npm ci
      - name: Lint (apps/web)
        working-directory: apps/web
        run: npm run lint --if-present
      - name: Build (apps/web)
        working-directory: apps/web
        run: npm run build --if-present
      - name: Run tests (apps/web)
        working-directory: apps/web
        run: npm test --silent
